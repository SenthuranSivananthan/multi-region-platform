<svg xmlns="http://www.w3.org/2000/svg" width="900" height="550" viewBox="0 0 900 550" role="img" aria-labelledby="title description" font-family="Segoe UI, Arial, sans-serif">
  <title id="title">Blob Object Replication to multiple accounts and regions</title>
  <desc id="description">One source storage account in region A asynchronously replicates selected block blobs to multiple independent destination accounts in customer chosen regions. Regions B and C illustrate two destinations, each with its own replication policy and endpoint. Customers select a recovery destination, redirect applications, enable destination writes, validate recovery, and configure failback.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 10 4 0 8Z" fill="#0F6CBD"/></marker>
  </defs>
  <rect width="900" height="550" rx="14" fill="#FFFFFF"/>
  <text x="450" y="32" text-anchor="middle" font-size="21" font-weight="600" fill="#243A57">One source account - multiple destination regions</text>
  <text x="450" y="56" text-anchor="middle" font-size="15" fill="#5B6778">One replication policy per destination account; two examples shown</text>
  <rect x="28" y="146" width="320" height="232" rx="12" fill="#F7FBFE" stroke="#8CC0EE" stroke-width="2"/>
  <text x="188" y="180" text-anchor="middle" font-size="18" font-weight="600" fill="#0B3A63">Source region A</text>
  <rect x="48" y="198" width="280" height="64" rx="10" fill="#E8F3FC" stroke="#0F6CBD"/>
  <text x="188" y="224" text-anchor="middle" font-size="18" font-weight="600" fill="#0B3A63">Source account</text>
  <text x="188" y="248" text-anchor="middle" font-size="15" fill="#243A57">Selected containers / datasets</text>
  <text x="188" y="302" text-anchor="middle" font-size="15" fill="#243A57">Change feed + blob versioning</text>
  <text x="188" y="334" text-anchor="middle" font-size="15" font-weight="600" fill="#0B6B38">Application writes</text>
  <rect x="552" y="80" width="320" height="168" rx="12" fill="#F0FAF8" stroke="#75BDB3" stroke-width="2"/>
  <text x="712" y="110" text-anchor="middle" font-size="18" font-weight="600" fill="#065F55">Customer chosen region B</text>
  <rect x="572" y="128" width="280" height="56" rx="10" fill="#E3F3EF" stroke="#087F73"/>
  <text x="712" y="150" text-anchor="middle" font-size="18" font-weight="600" fill="#065F55">Destination account 1</text>
  <text x="712" y="172" text-anchor="middle" font-size="15" fill="#243A57">Blob versioning enabled</text>
  <text x="712" y="210" text-anchor="middle" font-size="15" fill="#243A57">Replicated blobs can be read</text>
  <text x="712" y="232" text-anchor="middle" font-size="15" fill="#8A5A00">Enable writes during recovery</text>
  <rect x="552" y="270" width="320" height="168" rx="12" fill="#F0FAF8" stroke="#75BDB3" stroke-width="2"/>
  <text x="712" y="300" text-anchor="middle" font-size="18" font-weight="600" fill="#065F55">Customer chosen region C</text>
  <rect x="572" y="318" width="280" height="56" rx="10" fill="#E3F3EF" stroke="#087F73"/>
  <text x="712" y="340" text-anchor="middle" font-size="18" font-weight="600" fill="#065F55">Destination account 2</text>
  <text x="712" y="362" text-anchor="middle" font-size="15" fill="#243A57">Blob versioning enabled</text>
  <text x="712" y="400" text-anchor="middle" font-size="15" fill="#243A57">Replicated blobs can be read</text>
  <text x="712" y="422" text-anchor="middle" font-size="15" fill="#8A5A00">Enable writes during recovery</text>
  <path d="M350 262H398V164H548" fill="none" stroke="#0F6CBD" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M350 262H398V354H548" fill="none" stroke="#0F6CBD" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="476" y="128" text-anchor="middle" font-size="15" font-weight="600" fill="#0F548C">Replication policy 1</text>
  <text x="476" y="150" text-anchor="middle" font-size="15" fill="#0F548C">Async copy</text>
  <text x="476" y="254" text-anchor="middle" font-size="15" fill="#5B6778">Block blobs only</text>
  <text x="476" y="318" text-anchor="middle" font-size="15" font-weight="600" fill="#0F548C">Replication policy 2</text>
  <text x="476" y="340" text-anchor="middle" font-size="15" fill="#0F548C">Async copy</text>
  <rect x="28" y="466" width="844" height="62" rx="10" fill="#F2F4F7"/>
  <text x="450" y="489" text-anchor="middle" font-size="16" font-weight="600" fill="#243A57">Customer-managed recovery</text>
  <text x="450" y="513" text-anchor="middle" font-size="15" fill="#243A57">Select destination + redirect applications + enable writes + validate + plan failback</text>
</svg>
